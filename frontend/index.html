<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinelNarrator Dashboard</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --text: #c9d1d9;
            --text-muted: #8b949e;
            --border: #30363d;
            --low: #388bfd;
            --medium: #d29922;
            --high: #f0883e;
            --critical: #f85149;
            --success: #238636;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 1.5em; }
        .status-dot {
            height: 10px; width: 10px; border-radius: 50%; display: inline-block;
            background-color: var(--success); margin-right: 5px;
        }
        .status-dot.disconnected { background-color: var(--critical); }
        
        .stats-bar {
            display: flex; gap: 20px; margin-bottom: 20px;
            background: var(--panel); padding: 15px; border-radius: 6px; border: 1px solid var(--border);
        }
        .stat { flex: 1; }
        .stat-value { font-family: monospace; font-size: 1.2em; color: white; }
        
        .filters { margin-bottom: 20px; display: flex; gap: 10px; }
        select, input {
            background: var(--bg); color: var(--text); border: 1px solid var(--border);
            padding: 5px 10px; border-radius: 4px;
        }
        
        .feed { display: flex; flex-direction: column; gap: 15px; }
        .card {
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 6px; padding: 15px;
        }
        .card-header {
            display: flex; justify-content: space-between; font-family: monospace;
            border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 10px;
        }
        .badge {
            padding: 2px 6px; border-radius: 12px; font-size: 0.8em; font-weight: bold; text-transform: uppercase;
        }
        .badge.low { background: rgba(56,139,253,0.1); color: var(--low); }
        .badge.medium { background: rgba(210,153,34,0.1); color: var(--medium); }
        .badge.high { background: rgba(240,136,62,0.1); color: var(--high); }
        .badge.critical { background: rgba(248,81,73,0.1); color: var(--critical); }
        
        .explanation { font-style: italic; font-size: 1.1em; margin: 10px 0; color: white; }
        .causes { margin: 10px 0; padding-left: 20px; }
        .causes li { margin-bottom: 5px; }
        
        details { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 4px; margin: 10px 0; }
        summary { cursor: pointer; font-weight: bold; }
        
        .footer {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.85em; color: var(--text-muted); border-top: 1px solid var(--border);
            padding-top: 10px; margin-top: 10px;
        }
        button {
            background: var(--border); color: var(--text); border: none;
            padding: 5px 10px; border-radius: 4px; cursor: pointer;
        }
        button:hover { background: #484f58; }
        
        canvas { background: var(--bg); border: 1px solid var(--border); margin-left: 10px; }
    </style>
</head>
<body>
    <header>
        <h1>SentinelNarrator</h1>
        <div>
            <span class="status-dot" id="conn-status"></span>
            <span id="clock" style="font-family: monospace;"></span>
        </div>
    </header>

    <div class="stats-bar">
        <div class="stat">Total Anomalies<br><span class="stat-value" id="stat-total">0</span></div>
        <div class="stat">Avg Inference<br><span class="stat-value" id="stat-inf">0 ms</span></div>
        <div class="stat">Fallback Rate<br><span class="stat-value" id="stat-fallback">0.0%</span></div>
    </div>

    <div class="filters">
        <select id="filter-severity">
            <option value="all">All Severities</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>
        </select>
        <input type="text" id="filter-metric" placeholder="Filter metric...">
    </div>

    <div class="feed" id="feed"></div>

    <script>
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);

        function updateStats() {
            fetch('/stats').then(r => r.json()).then(data => {
                document.getElementById('stat-total').innerText = data.total_anomalies;
                document.getElementById('stat-inf').innerText = Math.round(data.avg_inference_ms) + ' ms';
                document.getElementById('stat-fallback').innerText = data.fallback_rate_pct.toFixed(1) + '%';
            });
        }
        setInterval(updateStats, 5000);
        updateStats();

        function copyIncident(text) {
            navigator.clipboard.writeText(text);
            alert('Incident report copied!');
        }

        function drawSparkline(canvas, data) {
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const min = Math.min(...data);
            const max = Math.max(...data);
            const range = max - min || 1;
            
            ctx.clearRect(0, 0, width, height);
            ctx.beginPath();
            ctx.strokeStyle = '#c9d1d9';
            ctx.lineWidth = 1;
            
            data.forEach((val, i) => {
                const x = (i / (data.length - 1)) * width;
                const y = height - ((val - min) / range) * height;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();
        }

        function createCard(data) {
            const ev = data.event;
            const llm = data.llm_output;
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.severity = ev.severity;
            card.dataset.metric = ev.metric_name;
            
            let causesHtml = llm ? llm.root_causes.map(c => `<li>${c.cause} <span class="badge ${c.likelihood === 'high' ? 'critical' : c.likelihood === 'medium' ? 'medium' : 'low'}">${c.likelihood}</span></li>`).join('') : '<li>LLM failed to generate root causes</li>';
            
            card.innerHTML = `
                <div class="card-header">
                    <div>
                        <span class="badge ${ev.severity}">${ev.severity}</span>
                        ${ev.metric_name}
                    </div>
                    <div>${new Date(ev.timestamp).toLocaleTimeString()}</div>
                </div>
                <div>Value: <b>${ev.value.toFixed(2)}</b> (Expected: ${ev.expected_min.toFixed(2)} - ${ev.expected_max.toFixed(2)})</div>
                ${llm ? `<div class="explanation">"${llm.explanation}"</div>
                <ul class="causes">${causesHtml}</ul>
                <details>
                    <summary>Incident Summary</summary>
                    <p>${llm.incident_summary}</p>
                </details>` : `<div class="explanation" style="color:var(--critical)">LLM Fallback Used</div>`}
                <div class="footer">
                    <div>
                        ${data.inference_time_ms}ms | Retries: ${data.retry_count} | Fallback: ${data.fallback_used}
                        <canvas width="60" height="30" class="sparkline"></canvas>
                    </div>
                    ${llm ? `<button onclick="copyIncident(\`${llm.incident_summary.replace(/`/g, '')}\`)">Copy Incident</button>` : ''}
                </div>
            `;
            
            setTimeout(() => {
                const canvas = card.querySelector('canvas');
                drawSparkline(canvas, ev.context_window);
            }, 0);
            
            return card;
        }

        const feed = document.getElementById('feed');

        function loadInitial() {
            fetch('/anomalies?limit=20').then(r => r.json()).then(data => {
                feed.innerHTML = '';
                data.forEach(d => feed.appendChild(createCard(d)));
                applyFilters();
            });
        }
        loadInitial();

        function connectSSE() {
            const evSource = new EventSource('/stream');
            const status = document.getElementById('conn-status');
            
            evSource.onopen = () => status.className = 'status-dot';
            evSource.onerror = () => status.className = 'status-dot disconnected';
            
            evSource.onmessage = (e) => {
                const data = JSON.parse(e.data);
                feed.insertBefore(createCard(data), feed.firstChild);
                applyFilters();
                if (feed.children.length > 50) feed.removeChild(feed.lastChild);
            };
        }
        connectSSE();

        function applyFilters() {
            const sev = document.getElementById('filter-severity').value;
            const term = document.getElementById('filter-metric').value.toLowerCase();
            
            document.querySelectorAll('.card').forEach(card => {
                const matchSev = sev === 'all' || card.dataset.severity === sev;
                const matchTerm = card.dataset.metric.toLowerCase().includes(term);
                card.style.display = (matchSev && matchTerm) ? 'block' : 'none';
            });
        }

        document.getElementById('filter-severity').addEventListener('change', applyFilters);
        document.getElementById('filter-metric').addEventListener('input', applyFilters);
    </script>
</body>
</html>
