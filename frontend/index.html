<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SentinelNarrator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --green: #3fb950;
    --blue: #58a6ff; --yellow: #d29922; --orange: #e3652a;
    --red: #f85149; --purple: #bc8cff;
  }
  body { background: var(--bg); color: var(--text); font-family: 'SF Mono', 'Fira Code', monospace; min-height: 100vh; }
  
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .logo { font-size: 16px; font-weight: 700; letter-spacing: -0.5px; }
  .logo span { color: var(--green); }
  .header-right { display: flex; align-items: center; gap: 20px; font-size: 12px; color: var(--muted); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; margin-right: 6px; animation: pulse 2s infinite; }
  .status-dot.red { background: var(--red); animation: none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  
  .stats-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 24px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .stat { text-align: center; }
  .stat-value { font-size: 22px; font-weight: 700; color: var(--blue); }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
  
  .controls { padding: 16px 24px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--border); }
  .filter-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-family: inherit; transition: all 0.15s; }
  .filter-btn:hover, .filter-btn.active { border-color: var(--blue); color: var(--blue); }
  .filter-btn.sev-low.active { border-color: var(--blue); color: var(--blue); }
  .filter-btn.sev-medium.active { border-color: var(--yellow); color: var(--yellow); }
  .filter-btn.sev-high.active { border-color: var(--orange); color: var(--orange); }
  .filter-btn.sev-critical.active { border-color: var(--red); color: var(--red); }
  .search { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 6px 14px; border-radius: 6px; font-size: 12px; font-family: inherit; outline: none; width: 200px; }
  .search:focus { border-color: var(--blue); }
  
  .feed { padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; max-width: 1100px; margin: 0 auto; }
  
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; transition: border-color 0.2s; position: relative; overflow: hidden; }
  .card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .card.low::before { background: var(--blue); }
  .card.medium::before { background: var(--yellow); }
  .card.high::before { background: var(--orange); }
  .card.critical::before { background: var(--red); }
  .card:hover { border-color: #484f58; }
  
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .card-left { display: flex; align-items: center; gap: 10px; }
  .metric-name { font-size: 15px; font-weight: 700; color: var(--text); }
  .sev-badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.8px; }
  .sev-badge.low { background: rgba(88,166,255,0.15); color: var(--blue); }
  .sev-badge.medium { background: rgba(210,153,34,0.15); color: var(--yellow); }
  .sev-badge.high { background: rgba(227,101,42,0.15); color: var(--orange); }
  .sev-badge.critical { background: rgba(248,81,73,0.15); color: var(--red); }
  .card-right { display: flex; align-items: center; gap: 12px; font-size: 11px; color: var(--muted); }
  
  .value-row { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; font-size: 12px; }
  .value-actual { font-size: 20px; font-weight: 700; color: var(--text); }
  .value-expected { color: var(--muted); }
  .zscore { color: var(--red); font-weight: 600; }
  
  .sparkline { margin-bottom: 12px; }
  
  .explanation { font-size: 13px; color: var(--text); line-height: 1.6; margin-bottom: 12px; padding: 10px 14px; background: rgba(88,166,255,0.05); border-radius: 6px; border-left: 2px solid var(--blue); font-family: -apple-system, sans-serif; }
  .fallback-tag { font-size: 11px; color: var(--muted); font-style: italic; }
  
  .causes { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .cause-pill { font-size: 11px; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); font-family: -apple-system, sans-serif; }
  .cause-pill.high { border-color: rgba(248,81,73,0.4); color: var(--red); background: rgba(248,81,73,0.05); }
  .cause-pill.medium { border-color: rgba(210,153,34,0.4); color: var(--yellow); background: rgba(210,153,34,0.05); }
  .cause-pill.low { border-color: var(--border); }
  
  .summary-toggle { font-size: 11px; color: var(--blue); cursor: pointer; background: none; border: none; font-family: inherit; padding: 0; margin-bottom: 8px; }
  .summary-text { font-size: 12px; color: var(--muted); line-height: 1.6; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 6px; margin-bottom: 10px; font-family: -apple-system, sans-serif; display: none; }
  .summary-text.open { display: block; }
  
  .card-footer { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 10px; margin-top: 4px; }
  .copy-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-family: inherit; transition: all 0.15s; }
  .copy-btn:hover { border-color: var(--green); color: var(--green); }
  
  .empty { text-align: center; padding: 60px; color: var(--muted); font-size: 14px; }
  .empty-sub { font-size: 12px; margin-top: 8px; }
  
  #clock { font-variant-numeric: tabular-nums; }
  
  @media (max-width: 600px) {
    .stats-bar { grid-template-columns: repeat(3, 1fr); }
    header { padding: 0 16px; }
    .feed { padding: 12px 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Sentinel<span>Narrator</span></div>
  <div class="header-right">
    <span><span class="status-dot" id="conn-dot"></span><span id="conn-status">Connecting...</span></span>
    <span id="clock"></span>
    <span>Gemma 3 1B · CPU · Tier 1</span>
  </div>
</header>

<div class="stats-bar">
  <div class="stat"><div class="stat-value" id="s-total">0</div><div class="stat-label">Anomalies</div></div>
  <div class="stat"><div class="stat-value" id="s-inf">—</div><div class="stat-label">Avg Inference</div></div>
  <div class="stat"><div class="stat-value" id="s-fallback">—</div><div class="stat-label">Fallback Rate</div></div>
  <div class="stat"><div class="stat-value" id="s-retry">—</div><div class="stat-label">Avg Retries</div></div>
  <div class="stat"><div class="stat-value" id="s-tier" style="font-size:13px;padding-top:4px">Tier 1 · Absolute Garage</div><div class="stat-label">Model Tier</div></div>
</div>

<div class="controls">
  <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
  <button class="filter-btn sev-low" onclick="setFilter('low',this)">Low</button>
  <button class="filter-btn sev-medium" onclick="setFilter('medium',this)">Medium</button>
  <button class="filter-btn sev-high" onclick="setFilter('high',this)">High</button>
  <button class="filter-btn sev-critical" onclick="setFilter('critical',this)">Critical</button>
  <input class="search" type="text" placeholder="Filter by metric..." oninput="applyFilters()" id="search">
</div>

<div class="feed" id="feed">
  <div class="empty" id="empty-state">
    <div>Waiting for anomalies...</div>
    <div class="empty-sub">Detection starts after 20 data points per metric (~20 seconds)</div>
  </div>
</div>

<script>
let currentFilter = 'all';
let allCards = [];

function setFilter(sev, btn) {
  currentFilter = sev;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function applyFilters() {
  const term = document.getElementById('search').value.toLowerCase();
  allCards.forEach(({el, severity, metric}) => {
    const matchSev = currentFilter === 'all' || severity === currentFilter;
    const matchTerm = metric.toLowerCase().includes(term);
    el.style.display = (matchSev && matchTerm) ? 'block' : 'none';
  });
}

function drawSparkline(canvas, values) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  if (!values || values.length < 2) return;
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  ctx.strokeStyle = '#58a6ff';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  values.forEach((v, i) => {
    const x = (i / (values.length - 1)) * w;
    const y = h - ((v - min) / range) * (h - 4) - 2;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();
  // Highlight last point
  const lx = w, ly = h - ((values[values.length-1] - min) / range) * (h - 4) - 2;
  ctx.fillStyle = '#f85149';
  ctx.beginPath();
  ctx.arc(lx - 1, ly, 3, 0, Math.PI * 2);
  ctx.fill();
}

function timeAgo(isoStr) {
  const diff = Math.floor((Date.now() - new Date(isoStr)) / 1000);
  if (diff < 60) return `${diff}s ago`;
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  return `${Math.floor(diff/3600)}h ago`;
}

function addCard(item, prepend=true) {
  const ev = item.event;
  const llm = item.llm_output;
  const sev = ev.severity;
  const isFallback = item.fallback_used || !llm;

  const card = document.createElement('div');
  card.className = `card ${sev}`;
  card.dataset.id = item.event.id;

  const explanation = llm ? llm.explanation : `${ev.metric_name} deviated ${Math.abs(ev.z_score).toFixed(1)}σ from baseline.`;
  const causes = llm ? llm.root_causes : [
    {cause: 'Unexpected load spike', likelihood: 'high'},
    {cause: 'Dependency failure', likelihood: 'medium'},
    {cause: 'Configuration change', likelihood: 'low'}
  ];
  const summary = llm ? llm.incident_summary : `ALERT [${sev.toUpperCase()}]: ${ev.metric_name} = ${ev.value.toFixed(2)}`;
  const confidence = llm ? `${(llm.confidence * 100).toFixed(0)}% confidence` : '';

  card.innerHTML = `
    <div class="card-header">
      <div class="card-left">
        <span class="metric-name">${ev.metric_name}</span>
        <span class="sev-badge ${sev}">${sev}</span>
        ${isFallback ? '<span class="sev-badge" style="background:rgba(139,148,158,0.15);color:#8b949e">fallback</span>' : ''}
      </div>
      <div class="card-right">
        <span>${timeAgo(ev.timestamp)}</span>
        <span>${ev.detection_method}</span>
      </div>
    </div>
    <div class="value-row">
      <span class="value-actual">${ev.value.toFixed(2)}</span>
      <span class="value-expected">expected ${ev.expected_min.toFixed(1)}–${ev.expected_max.toFixed(1)}</span>
      <span class="zscore">z=${ev.z_score.toFixed(2)}</span>
      ${confidence ? `<span style="color:var(--green);font-size:11px">${confidence}</span>` : ''}
    </div>
    <div class="sparkline"><canvas width="100%" height="36" style="width:100%;display:block" class="spark"></canvas></div>
    <div class="explanation">${explanation}</div>
    <div class="causes">
      ${causes.map(c => `<span class="cause-pill ${c.likelihood}">${c.likelihood === 'high' ? '▲' : c.likelihood === 'medium' ? '◆' : '▼'} ${c.cause}</span>`).join('')}
    </div>
    <button class="summary-toggle" onclick="toggleSummary(this)">▶ Show incident report</button>
    <div class="summary-text">${summary}</div>
    <div class="card-footer">
      <span>${new Date(ev.timestamp).toLocaleTimeString()} · ${item.inference_time_ms}ms inference · ${item.retry_count} retries</span>
      <button class="copy-btn" onclick="copyReport(this, '${encodeURIComponent(summary)}')">Copy report</button>
    </div>
  `;

  const feed = document.getElementById('feed');
  const empty = document.getElementById('empty-state');
  if (empty) empty.remove();

  if (prepend) feed.insertBefore(card, feed.firstChild);
  else feed.appendChild(card);

  // Draw sparkline
  const canvas = card.querySelector('.spark');
  if (ev.context_window) drawSparkline(canvas, ev.context_window);

  allCards.unshift({el: card, severity: sev, metric: ev.metric_name});
  applyFilters();
}

function toggleSummary(btn) {
  const txt = btn.nextElementSibling;
  const open = txt.classList.toggle('open');
  btn.textContent = open ? '▼ Hide incident report' : '▶ Show incident report';
}

function copyReport(btn, encoded) {
  navigator.clipboard.writeText(decodeURIComponent(encoded)).then(() => {
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy report', 2000);
  });
}

// Stats
function updateStats() {
  fetch('/stats').then(r => r.json()).then(d => {
    document.getElementById('s-total').textContent = d.total_anomalies;
    document.getElementById('s-inf').textContent = d.avg_inference_ms > 0 ? `${(d.avg_inference_ms/1000).toFixed(1)}s` : '—';
    document.getElementById('s-fallback').textContent = `${d.fallback_rate_pct.toFixed(0)}%`;
    document.getElementById('s-retry').textContent = d.avg_retry_count.toFixed(1);
  }).catch(() => {});
}

// Load existing anomalies
fetch('/anomalies?limit=50').then(r => r.json()).then(data => {
  if (data && data.length > 0) {
    document.getElementById('empty-state')?.remove();
    [...data].reverse().forEach(item => addCard(item, true));
  }
}).catch(() => {});

// SSE live stream
function connectSSE() {
  const es = new EventSource('/stream');
  es.onopen = () => {
    document.getElementById('conn-dot').classList.remove('red');
    document.getElementById('conn-status').textContent = 'Live';
  };
  es.onmessage = (e) => {
    try { addCard(JSON.parse(e.data)); } catch {}
  };
  es.onerror = () => {
    document.getElementById('conn-dot').classList.add('red');
    document.getElementById('conn-status').textContent = 'Reconnecting...';
    es.close();
    setTimeout(connectSSE, 3000);
  };
}
connectSSE();

// Clock
setInterval(() => {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString();
}, 1000);

// Stats refresh
updateStats();
setInterval(updateStats, 5000);
</script>
</body>
</html>
