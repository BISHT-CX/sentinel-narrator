# Note: To deploy on Cloud Run (which does not support persistent volumes easily without external setup), 
# the model file must be baked into the Docker image. 
# You can add a build step or ARG MODEL_URL to download the model during the docker build.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/sentinel-narrator', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sentinel-narrator']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sentinel-narrator'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sentinel-narrator'
      - '--platform'
      - 'managed'
      - '--region'
      - 'us-central1'
      - '--cpu'
      - '4'
      - '--memory'
      - '4Gi'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '10'
      - '--max-instances'
      - '3'
      - '--allow-unauthenticated'